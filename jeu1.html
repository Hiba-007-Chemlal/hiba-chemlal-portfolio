<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    font-family: "Poppins", "Segoe UI", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    overflow-x: hidden;
    background: radial-gradient(circle at 10% 15%, rgba(255,255,255,.85), transparent 25%),
                radial-gradient( circle at 90% 85%, rgba(220,190,255,.55), transparent 28%),
                linear-gradient(135deg, #c9b4df 0%, #b695d2 45%, #ead8f2 100%);
}
.game {
    width: 100%;
    max-width: 500px;
    min-height: 720px;
    padding: 30px 28px;
    position: relative;
    text-align: center;
    overflow: hidden;
    border-radius: 38px;
    border: 1px solid rgba(255,255,255,.65);
    background: linear-gradient(145deg, rgba(255,255,255,.34), rgba(255,255,255,.13));
    box-shadow: 0 30px 80px rgba(74,40,100,.28);
}
.game::before {
    content: "";
    position: absolute;
    width: 200px;
    height: 200px;
    top: -100px;
    right: -80px;
    border-radius: 50%;
    background:rgba(255,255,255,.13);
    pointer-events: none;
}
.game::after {
    content: "";
    position: absolute;
    width: 145px;
    height: 145px;
    bottom: -70px;
    left: -60px;
    border-radius: 50%;
    background:rgba(255,255,255,.12);
    pointer-events: none;
}
.header {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 15px;
}
.title {
    color: #ffffff;
    font-weight: 900;
    letter-spacing: .7px;
    text-shadow:0 3px 10px rgba(55,25,75,.35);
}
.score {
    padding: 9px 16px;
    border-radius: 50px;
    background:rgba(255,255,255,.96);
    color: #7c3aed;
    font-size: 15px;
    font-weight: 900;
    box-shadow:0 8px 20px rgba(65,30,90,.14);
}
.score:hover {
    transform:
        translateY(-2px)
        scale(1.05);
}
.instructions {
    position: relative;
    margin-bottom: 13px;
    color: #ffffff;
    font-size: 14px;
    line-height: 1.6;
    text-shadow:0 2px 6px rgba(50,20,70,.3);
}
.instructions strong {
    color: #ffffff;
    font-weight: 900;
}
.lives {
    position: relative;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    padding: 7px 16px;
    margin-bottom: 12px;
    min-height: 44px;
    border-radius: 50px;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.28);
    font-size: 23px;
    letter-spacing: 2px;
    box-shadow:0 8px 20px rgba(60,30,80,.10);
}
.history {
    position: relative;
    width: 100%;
    height: 245px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color:rgba(124,58,237,.45) transparent;
}
.number-box {
    width: 175px;
    min-height: 53px;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 20px;
    color: #ffffff;
    font-size: 27px;
    font-weight: 900;
    background:linear-gradient(135deg, #9b59d0, #7139a8);
    box-shadow:0 9px 22px rgba(100,45,150,.30);
}
.number-box:hover {
    transform:scale(1.03);
}
.number-box.correct {
    background:linear-gradient(135deg, #c084fc, #8b5cf6);
    box-shadow:0 10px 25px rgba(139,92,246,.35);
}
@keyframes appear {
    from {
        opacity: 0;
        transform:
            translateY(15px)
            scale(.7);
    }
    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}
@keyframes correctAnimation {
    0% {
        transform: scale(.8);
    }
    50% {
        transform: scale(1.12);
    }
    100% {
        transform: scale(1);
    }
}
.message {
    position: relative;
    z-index: 2;
    min-height: 38px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 8px 0;
    padding: 4px;
    color: #ffffff;
    font-size: 16px;
    font-weight: 800;
    text-shadow:0 2px 7px rgba(55,25,75,.35);
    transition: .3s ease;
}
.input-area {
    position: relative;
    z-index: 3;
    width: 100%;
    margin-top: 3px;
}
input {
    width: 100%;
    height: 53px;
    border:2px solid rgba(255,255,255,.55);
    outline: none;
    border-radius: 18px;
    background:rgba(255,255,255,.95);
    color: #4c3570;
    font-size: 23px;
    font-weight: 900;
    text-align: center;
    box-shadow:0 9px 22px rgba(65,30,90,.13);
    transition: .25s ease;
}
input::placeholder {
    color: #a99bb7;
}
input:focus {
    border-color:#a855f7;
    box-shadow:0 0 0 4px rgba(168,85,247,.15), 0 10px 25px rgba(65,30,90,.13);
}
.keyboard {
    position: relative;
    z-index: 3;
    width: 100%;
    display: grid;
    grid-template-columns:repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
}
.keyboard button {
    height: 48px;
    border: none;
    outline: none;
    border-radius: 15px;
    background:linear-gradient(145deg, rgba(255,255,255,.98), rgba(239,229,247,.93));
    color: #54376f;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
}
@media (hover: hover) {
    .keyboard button:hover {
        transform:translateY(-3px);
        box-shadow:0 11px 20px rgba(70,35,95,.20);
    }
}
.keyboard button:active {
    transform:scale(.90);
    box-shadow:0 3px 7px rgba(70,35,95,.16);
}
.keyboard .delete {
    background:linear-gradient(145deg, #ead1f4, #d4aee5);
    color:#7026a0;
}
.keyboard .enter {
    background:linear-gradient(145deg, #c084fc, #7c3aed);
    color: white;
    font-size: 25px;
    box-shadow:0 9px 19px rgba(124,58,237,.35);
}
.keyboard .enter:hover {
    background:linear-gradient(145deg, #d09afc, #8b5cf6);
}
.win {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 20;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 25px;
    border-radius: 38px;
    background:linear-gradient(145deg, rgba(42,22,60,.98), rgba(70,38,90,.97));
    backdrop-filter: blur(16px);
    color: white;
}
@keyframes winAppear {
    from {
        opacity: 0;
        transform:scale(.94);
    }
    to {
        opacity: 1;
        transform:scale(1);
    }
}
.win-icon {
    font-size:clamp(70px, 18vw, 95px);
    margin-bottom: 4px;
    filter:drop-shadow(0 10px 15px rgba(0,0,0,.25));
}
@keyframes bounce {
    0%, 100% {
        transform:
            translateY(0)
            rotate(0);
    }
    50% {
        transform:
            translateY(-15px)
            rotate(4deg);
    }
}
.win h2 {
    margin: 8px 0;
    color:#d8b4fe;
    font-size:clamp(40px, 10vw, 55px);
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow:0 0 22px rgba(216,180,254,.4);
}
.win p {
    max-width: 290px;
    margin-bottom: 25px;
    color:rgba(255,255,255,.9);
    font-size: 16px;
    line-height: 1.6;
}
.restart {
    border: none;
    outline: none;
    padding:14px 30px;
    border-radius: 50px;
    background:linear-gradient(135deg, #c084fc, #7c3aed);
    color: white;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow:0 12px 27px rgba(124,58,237,.35);
    transition: .25s ease;
}
.restart:hover {
    transform:
        translateY(-3px)
        scale(1.04);
    box-shadow:0 17px 32px rgba(124,58,237,.42);
}
.restart:active {
    transform:scale(.94);
}
.confetti {
    position: fixed;
    width: 8px;
    height: 17px;
    top: -20px;
    border-radius: 2px;
    z-index: 50;
    animation:fall 3s linear forwards;
}
@keyframes fall {
    to {
        transform:
            translateY(110vh)
            rotate(720deg);
        opacity: .9;
    }
}
@media (max-width: 700px) {
    body {
        padding: 15px;
    }
    .game {
        max-width: 500px;
        min-height: 700px;
        padding:27px 23px;
    }
}
@media (max-width: 500px) {
    body {
        min-height: 100svh;
        padding: 0;
        align-items: stretch;
    }
    .game {
        width: 100%;
        max-width: none;
        min-height: 100svh;
        padding:22px 17px 18px;
        border-radius: 0;
        display: flex;
        flex-direction: column;
    }
    .win {
        border-radius: 0;
    }
    .header {
        margin-bottom: 10px;
    }
    .title {
        font-size: 17px;
    }
    .score {
        padding:8px 12px;
        font-size: 13px;
    }
    .instructions {
        font-size: 13px;
        margin-bottom: 8px;
    }
    .lives {
        font-size: 21px;
        padding:6px 12px;
        margin-bottom: 7px;
    }
    .history {
        flex: 1;
        height: auto;
        min-height: 150px;
        max-height: 200px;
    }
    .number-box {
        width: 155px;
        min-height: 48px;
        font-size: 24px;
        border-radius: 17px;
    }
    .message {
        min-height: 34px;
        margin: 5px 0;
        font-size: 14px;
    }
    input {
        height: 50px;
        font-size: 21px;
    }
    .keyboard {
        gap: 7px;
        margin-top: 8px;
    }
    .keyboard button {
        height: 45px;
        border-radius: 13px;
        font-size: 19px;
    }
    .keyboard .enter {
        font-size: 23px;
    }
    .win h2 {
        font-size: 42px;
    }
    .win-icon {
        font-size: 72px;
    }
}
@media (max-width: 360px) {
    .game {
        padding:18px 12px 14px;
    }
    .title {
        font-size: 15px;
    }
    .score {
        padding: 7px 10px;
        font-size: 12px;
    }
    .lives {
        font-size: 19px;
        letter-spacing: 1px;
    }
    .history {
        max-height: 165px;
    }
    .keyboard {
        gap: 5px;
    }
    .keyboard button {
        height: 42px;
        border-radius: 12px;
        font-size: 17px;
    }
    input {
        height: 47px;
        font-size: 20px;
    }
}
    </style>
</head>
<body>
<div class="game">
    <div class="header">
        <div class="title"> 🎯 GUESS THE NUMBER </div>
        <div class="score"> ⭐ <span id="score">0</span> </div>
    </div>
    <div class="instructions">
        Trouve le nombre secret entre
        <strong>1 et 100</strong>
    </div>
    <div class="lives" id="lives"> ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ </div>
    <div class="history" id="history">
    </div>
    <div class="message" id="message"> Entre ton premier nombre 👇 </div>
    <div class="input-area">
        <input type="number" id="number" min="1" max="100" placeholder="Nombre..." readonly>
    </div>
    <div class="keyboard">
        <button type="button" onclick="pressNumber('1')"> 1 </button>
        <button type="button" onclick="pressNumber('2')"> 2 </button>
        <button type="button" onclick="pressNumber('3')"> 3 </button>
        <button type="button" onclick="pressNumber('4')"> 4 </button>
        <button type="button" onclick="pressNumber('5')"> 5 </button>
        <button type="button" onclick="pressNumber('6')"> 6 </button>
        <button type="button" onclick="pressNumber('7')"> 7 </button>
        <button type="button" onclick="pressNumber('8')"> 8 </button>
        <button type="button" onclick="pressNumber('9')"> 9 </button>
        <button type="button" class="delete" onclick="deleteNumber()"> ⌫ </button>
        <button type="button" onclick="pressNumber('0')"> 0 </button>
        <button type="button" class="enter" onclick="checkNumber()"> ✓ </button>
    </div>
    <div class="win" id="win">
        <div class="win-icon"> 🏆 </div>
        <h2> YOU WIN! </h2>
        <p id="winText"> Bravo ! </p>
        <button class="restart" onclick="restartGame()"> 🔄 PLAY AGAIN </button>
    </div>
</div>
<script>
    let secretNumber = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;
    let score = 0;
    const maxAttempts = 7;
    function checkNumber() {
        const input = document.getElementById("number");
        const number = Number(input.value);
        if (input.value === "" || number < 1 || number > 100) {
            document.getElementById("message").textContent = "⚠️ Entre un nombre entre 1 et 100";
            return;
        }
        attempts++;
        const box = document.createElement("div");
        box.classList.add("number-box");
        box.textContent = number;
        document.getElementById("history").appendChild(box);
        if (number === secretNumber) {
            box.classList.add("correct");
            score += (maxAttempts - attempts + 1) * 100;
            document.getElementById("score").textContent = score;
            document.getElementById("message").textContent = "🎉 Exact ! Tu as trouvé !";
            showWin();
            return;
        }
        if (number < secretNumber) {
            document.getElementById("message").textContent = "⬆️ PLUS GRAND !";
        } else {
            document.getElementById("message").textContent = "⬇️ PLUS PETIT !";
        }
        updateLives();
        if (attempts >= maxAttempts) {
            document.getElementById("message").textContent = "😢 Game Over ! Le nombre était " + secretNumber;
            setTimeout(() => {
                restartGame();
            }, 2500);

        }
        input.value = "";
    }
    function updateLives() {
        let lives = "";
        for (let i = 0; i < maxAttempts - attempts; i++) {
            lives += "❤️ ";
        }
        for (let i = maxAttempts - attempts; i < maxAttempts; i++) {
            lives += "🖤 ";
        }
        document.getElementById("lives").textContent = lives;
    }
    function showWin() {
        document.getElementById("win").style.display = "flex";
        document.getElementById("winText").textContent = "Tu as trouvé " + secretNumber + " en " + attempts + " tentative(s) !";
        createConfetti();
    }
    function createConfetti() {
        const colors = ["#e92d52", "#20d8d5", "#ffd166", "#ffffff", "#764ba2"];
        for (let i = 0; i < 80; i++) {
            const confetti = document.createElement("div");
            confetti.className = "confetti";
            confetti.style.left = Math.random() * 100 + "vw";
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDelay = Math.random() * 2 + "s";
            document.body.appendChild(confetti);
            setTimeout(() => {
                confetti.remove();
            }, 5000);
        }
    }
    function restartGame() {
        secretNumber = Math.floor(Math.random() * 100) + 1;
        attempts = 0;
        document.getElementById("history").innerHTML = "";
        document.getElementById("number").value = "";
        document.getElementById("message").textContent = "Entre ton premier nombre 👇";
        document.getElementById("lives").textContent = "❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️";
        document.getElementById("win").style.display = "none";
    }
    function pressNumber(number) {
        const input = document.getElementById("number");
        if (input.value.length >= 3) {
            return;
        }
        input.value += number;
        if (Number(input.value) > 100) {
            input.value = "100";
        }
    }
    function deleteNumber() {
        const input = document.getElementById("number");
        input.value = input.value.slice(0, -1);
    }
    document.addEventListener("keydown", function(event) {
            const input = document.getElementById("number");
            if (event.key >= "0" && event.key <= "9") {
                pressNumber(event.key);
            }
            if (event.key === "Backspace") {
                deleteNumber();
            }
            if (event.key === "Enter") {
                checkNumber();
            }
        }
    );
</script>
</body>
</html>
